# Secrets must be created manually before deploying:
#
# kubectl create secret generic honcho-secrets \
#   --from-literal=db-password=<your-db-password> \
#   --from-literal=gemini-api-key=<your-gemini-api-key> \
#   --namespace=honcho
#
# Required secret keys:
# - db-password: PostgreSQL database password
# - gemini-api-key: Google Gemini API key for the deriver
