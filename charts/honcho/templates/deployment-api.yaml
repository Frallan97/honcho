apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "honcho.fullname" . }}-api
  labels:
    {{- include "honcho.labels" . | nindent 4 }}
    component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "honcho.selectorLabels" . | nindent 6 }}
      component: api
  template:
    metadata:
      labels:
        {{- include "honcho.selectorLabels" . | nindent 8 }}
        component: api
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z {{ include "honcho.fullname" . }}-postgres {{ .Values.postgres.service.port }}; do sleep 2; done']
      containers:
      - name: api
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        command: ["sh", "docker/entrypoint.sh"]
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "honcho.fullname" . }}-secrets
              key: db-password
        - name: DB_CONNECTION_URI
          value: "postgresql+psycopg://{{ .Values.postgres.env.POSTGRES_USER }}:$(DB_PASSWORD)@{{ include "honcho.fullname" . }}-postgres:{{ .Values.postgres.service.port }}/{{ .Values.postgres.env.POSTGRES_DB }}"
        - name: CACHE_URL
          value: "redis://{{ include "honcho.fullname" . }}-redis:{{ .Values.redis.service.port }}/0?suppress=true"
        - name: CACHE_ENABLED
          value: "true"
        - name: AUTH_USE_AUTH
          value: "false"
        - name: LLM_GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "honcho.fullname" . }}-secrets
              key: gemini-api-key
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
